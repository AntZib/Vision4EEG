[project]
name = "eeg-vision-fm"
version = "0.1.0"
description = "Do vision foundation models (DINOv2) understand EEG topomaps?"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
